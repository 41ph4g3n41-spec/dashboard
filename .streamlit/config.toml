[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6e6e6"
font = "sans serif"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[logger]
level = "warning"
